<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lexend:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px; height: 628px;
      overflow: hidden;
      font-family: 'Lexend', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .canvas {
      position: relative;
      width: 1200px; height: 628px;
      background: #0F0F0F;
      overflow: hidden;
    }
    .calli-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.04;
    }
    /* Teal glow behind the logo */
    .glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(75,219,219,0.15) 0%, transparent 70%);
    }
    .teal-line {
      position: absolute;
      top: 50%; left: 50%;
      transform: translateX(-50%);
      width: 64px; height: 2px;
      background: #4BDBDB;
      margin-top: 8px;
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 100px;
    }
    .logo {
      width: 64px; height: 64px;
      margin-bottom: 32px;
    }
    .overline {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 20px;
    }
    .headline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400; font-size: 72px;
      line-height: 1.0; letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .headline em { font-style: italic; color: #4BDBDB; }
    .accent-line {
      width: 48px; height: 2px;
      background: #4BDBDB;
      margin: 24px auto;
    }
    .subline {
      font-weight: 300; font-size: 17px;
      line-height: 1.6;
      color: rgba(255,255,255,0.45);
      max-width: 560px;
    }
    .url {
      margin-top: 28px;
      font-size: 13px; font-weight: 400;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(75,219,219,0.6);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img src="../assets/backgrounds/calligraphy-11.jpg" class="calli-bg" alt="">
    <div class="glow"></div>
    <div class="content">
      <img src="../assets/coherence-logo-white.svg" class="logo" alt="The Coherence Company">
      <div class="overline">The Coherence Company</div>
      <h1 class="headline">Humans and AI,<br><em>wiser together.</em></h1>
      <div class="accent-line"></div>
      <p class="subline">AI-supported collaboration infrastructure that helps groups turn dialogue into shared intelligence and coordinated action.</p>
      <div class="url">coherence.tv</div>
    </div>
  </div>
</body>
</html>
