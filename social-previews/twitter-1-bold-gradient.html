<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lexend:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px; height: 628px;
      overflow: hidden;
      font-family: 'Lexend', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /*
      Twitter/X summary_large_image card: 1200×628px.
      Twitter shows it with rounded corners (~16px) and crops it.
      Keep all key content within a 40px inset from each edge.
    */
    .canvas {
      position: relative;
      width: 1200px; height: 628px;
      background: linear-gradient(180deg, #4BDBDB 0%, #B1EFEF 28%, #D6F6F6 50%, #ffffff 80%);
      overflow: hidden;
    }
    .watermark {
      position: absolute;
      right: -40px; top: -20px;
      width: 460px; height: 460px;
      opacity: 0.08;
    }
    .vertical-text {
      position: absolute;
      right: 36px; top: 0; bottom: 0;
      display: flex; align-items: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #555555;
    }
    .logo {
      position: absolute;
      top: 52px; left: 60px;
      width: 64px; height: 64px;
    }
    .content {
      position: absolute;
      left: 60px; bottom: 60px;
      max-width: 740px;
    }
    .overline {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #555555;
      margin-bottom: 16px;
    }
    /* Larger, bolder headline — Twitter rewards visual impact */
    .headline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400; font-size: 80px;
      line-height: 0.98; letter-spacing: -0.025em;
      color: #0F0F0F;
      margin-bottom: 20px;
    }
    .headline em { font-style: italic; color: #1F9A9A; }
    .subline {
      font-weight: 300; font-size: 17px;
      line-height: 1.5; color: #333333;
      max-width: 520px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img src="../assets/coherence-logo-white.svg" class="watermark" alt="">
    <div class="vertical-text">The Coherence Company</div>
    <img src="../assets/coherence-logo-white.svg" class="logo" alt="The Coherence Company">
    <div class="content">
      <div class="overline">The Coherence Company</div>
      <h1 class="headline">Humans and AI,<br><em>wiser together.</em></h1>
      <p class="subline">From first contact to coordinated action — coherence.tv</p>
    </div>
  </div>
</body>
</html>
