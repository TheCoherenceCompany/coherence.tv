<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lexend:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px; height: 630px;
      overflow: hidden;
      font-family: 'Lexend', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .canvas { display: flex; width: 1200px; height: 630px; }

    /* ── Left panel ── */
    .left {
      width: 408px;
      background: linear-gradient(155deg, #2BB8B8 0%, #156D6D 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px 48px;
      position: relative;
      overflow: hidden;
    }
    .left-watermark {
      position: absolute;
      right: -64px; bottom: -64px;
      width: 320px; height: 320px;
      opacity: 0.12;
    }
    .left-logo {
      width: 72px; height: 72px;
    }
    .left-bottom { position: relative; z-index: 1; }
    .left-overline {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 14px;
    }
    .left-tagline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400; font-size: 30px;
      line-height: 1.15; letter-spacing: -0.02em;
      color: #ffffff;
    }
    .left-tagline em { font-style: italic; }

    /* ── Right panel ── */
    .right {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 60px 60px 64px;
      position: relative;
    }
    .right-overline {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #777777;
      margin-bottom: 24px;
    }
    .right-headline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400; font-size: 44px;
      line-height: 1.08; letter-spacing: -0.02em;
      color: #0F0F0F;
      margin-bottom: 26px;
    }
    .right-headline em { font-style: italic; color: #1F9A9A; }
    .right-body {
      font-weight: 300; font-size: 17px;
      line-height: 1.6; color: #333333;
      max-width: 480px;
      margin-bottom: 36px;
    }
    .right-url {
      font-size: 13px; font-weight: 400;
      letter-spacing: 0.04em; color: #9A9A9A;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="left">
      <img src="../assets/coherence-logo-white.svg" class="left-logo" alt="">
      <img src="../assets/coherence-logo-white.svg" class="left-watermark" alt="">
      <div class="left-bottom">
        <div class="left-overline">The Coherence Company</div>
        <div class="left-tagline">Coherent work,<br><em>by design.</em></div>
      </div>
    </div>
    <div class="right">
      <div class="right-overline">Coherence Conversations</div>
      <h2 class="right-headline">Activate the people<br>in your event<br><em>before they arrive.</em></h2>
      <p class="right-body">Guided conversations, AI Guides, and synthesis tools that help groups move from first contact into real relationships and shared action.</p>
      <div class="right-url">coherence.tv</div>
    </div>
  </div>
</body>
</html>
